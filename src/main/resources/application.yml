# src/main/resources/application.yml
spring:
  embedded:
    kafka:
      # turn on the in-JVM broker
      ports: random

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

    consumer:
      group-id: midas-group
      auto-offset-reset: earliest

      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        # tell the JsonDeserializer which packages it can trust
        spring.json.trusted.packages: com.jpmc.midascore.foundation
        # and the fully-qualified class name to bind JSON to
        spring.json.value.default.type: com.jpmc.midascore.foundation.Transaction

    # so you can use @KafkaListener(topics = "${spring.kafka.topic}")
    topic: test-topic

general:
  kafka-topic: test-topic